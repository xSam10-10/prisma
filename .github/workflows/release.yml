# Gera o instalador do Windows, o app da TV LG e o APK do Android e publica numa Release.
# Dispara ao enviar uma tag "v*" (ex.: v0.1.0) ou pelo botão "Run workflow"
# na aba Actions.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/PRISMA-Setup-*.exe
            release/PRISMA-Setup-*.exe.blockmap
            release/latest.yml

  webos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:webos
      - run: npx --yes es-check@8.0.2 es5 "dist-webos/assets/*.js"
      - run: npx --yes -p @webos-tools/cli ares-package dist-webos -o .
      - uses: actions/upload-artifact@v4
        with:
          name: webos
          path: com.prisma.iptv_*.ipk

  android:
    runs-on: ubuntu-latest
    env:
      HAS_KS: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build:android
      - name: Chave própria (opcional, secrets do repositório)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KSPW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        if: env.HAS_KS == 'true'
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/prisma.jks"
          echo "PRISMA_KEYSTORE=$RUNNER_TEMP/prisma.jks" >> "$GITHUB_ENV"
          echo "PRISMA_KEYSTORE_PASSWORD=$KSPW" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compila o APK (até 3 tentativas, a rede do GitHub às vezes falha)
        run: |
          cd android && chmod +x gradlew
          for i in 1 2 3; do ./gradlew --no-daemon assembleRelease && exit 0; echo "tentativa $i falhou"; sleep 20; done
          exit 1
      - name: Confere o APK (Google TV, versão, assinatura)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt" dump badging android/app/build/outputs/apk/release/app-release.apk | grep -E "package:|leanback|application:|uses-feature" | head
          "$BT/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | head -3
      - run: |
          V=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/release/app-release.apk "PRISMA-Android-$V.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: PRISMA-Android-*.apk

  release:
    needs: [windows, webos, android]
    runs-on: ubuntu-latest
    env:
      HAS_RT: ${{ secrets.RELEASES_TOKEN != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publica a Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in v*) ;; *) TAG="v$(date +%Y.%m.%d-%H%M)";; esac
          NOTES="Downloads: PRISMA-Setup (Windows), com.prisma.iptv (TV LG) e PRISMA-Android (celular e Google TV). No Windows, na primeira vez: Mais informações › Executar assim mesmo."
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "PRISMA $TAG" --notes "$NOTES" --target "$GITHUB_SHA"
          gh release upload "$TAG" out/* --clobber
      # Atualização automática do Windows: copia os instaladores para o
      # repositório público xSam10-10/prisma-releases (só binários, sem código).
      # Precisa do secret RELEASES_TOKEN (token com acesso a esse repositório).
      - name: Publica para a atualização automática
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        if: env.HAS_RT == 'true'
        run: |
          V=$(ls out/PRISMA-Setup-*.exe | sed -E 's/.*Setup-(.*)\.exe/\1/')
          gh release create "v$V" --repo xSam10-10/prisma-releases --title "PRISMA $V" --notes "Instaladores do PRISMA $V." out/* || gh release upload "v$V" --repo xSam10-10/prisma-releases out/* --clobber
