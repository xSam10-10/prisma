# Só o APK do Android (teste de build, sem Release).
name: Android

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      HAS_KS: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build:android
      - name: Chave própria (opcional, secrets do repositório)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KSPW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        if: env.HAS_KS == 'true'
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/prisma.jks"
          echo "PRISMA_KEYSTORE=$RUNNER_TEMP/prisma.jks" >> "$GITHUB_ENV"
          echo "PRISMA_KEYSTORE_PASSWORD=$KSPW" >> "$GITHUB_ENV"
      - run: cd android && chmod +x gradlew && ./gradlew --no-daemon assembleRelease
      - run: |
          V=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/release/app-release.apk "PRISMA-Android-$V.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: PRISMA-Android-*.apk

